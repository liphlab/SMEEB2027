# ----
# Site

title: "Stochastic Models and Experiments in Ecology and Biology"
url: "https://liphlab.github.io/SMEEB2027"
repository: liphlab/SMEEB2027
# The site lives in a subfolder of liphlab.github.io, so every internal link has
# to start with /SMEEB2027. Do not change this. The local preview (./preview.sh)
# overrides it with --baseurl "" so that http://localhost:4000 works as usual.
baseurl: "/SMEEB2027"

# ------------------------------------------------------------------
# PRIVATE PREVIEW SWITCH
# While this is true, every page tells Google & co. "do not index me", and the
# sitemap is not advertised. The site is still reachable by anyone who has the
# link -- GitHub Pages has no password protection -- but it will not show up in
# search results.
#
# When the website is final and we want it to be found, change the line below
# to  noindex: false  and push. That is the only change needed.
# ------------------------------------------------------------------
noindex: true
google_analytics_key: ""
google_maps_javascript_api_key:
disqus_shortname:

# Values for the jekyll-seo-tag gem (http://github.com/jekyll/jekyll-seo-tag)
logo: /siteicon.png
description: "SMEEB 2027 - Stochastic Models and Experiments in Ecology and Biology. Venice, Italy, 26-28 May 2027."
author:
  name: SMEEB organizing committee
  email: smeeb2027@gmail.com
  twitter: # twitter username without the @ symbol
social:
  name: #Frisco Template
  links:
    #- http://github.com/CloudCannon/frisco-jekyll-template

# -----
# Build

timezone: Etc/UTC

permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE
  - LICENSE
  # local preview only: keep Jekyll out of the installed gems and its own output
  - vendor
  - .bundle

collections:
  speakers:
    _hide_content: true
  organizers:
    _hide_content: true

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      image:
        width: 2000
        height: 1322
        resize_style: cover
      bottom_image:
        width: 2000
        height: 1322
        resize_style: cover

# -----------
# CloudCannon

social_icons:
  - Facebook
  - Google Plus
  - Instagram
  - LinkedIn
  - Pinterest
  - Tumblr
  - Twitter
  - YouTube
  - Email
  - RSS

_comments:
  description: #Text shown when sharing on social media
  blurb: #Short bio or description of this person
